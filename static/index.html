<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .slide-in { animation: slide-in 220ms ease-out; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Gaming Notification Service</h1>
      <p class="mt-1 text-sm text-slate-400">
        Two players connected over WebSockets. Trigger an event on one side and watch the notification arrive live.
      </p>
      <p class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-400">
        <span class="rounded bg-slate-800 px-2 py-1">GameEngine / SocialSystem</span>→
        <span class="rounded bg-slate-800 px-2 py-1">Event bus</span>→
        <span class="rounded bg-slate-800 px-2 py-1">Router: format · check preferences</span>→
        <span class="rounded bg-slate-800 px-2 py-1">WebSocket channel</span>
      </p>
    </header>

    <div id="panels" class="grid gap-6 md:grid-cols-2"></div>
  </main>

  <!-- One player panel; cloned per player. -->
  <template id="panel-template">
    <section class="flex flex-col overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70 shadow-xl">
      <header class="flex items-center justify-between gap-3 border-b border-slate-800 p-4">
        <div class="flex items-center gap-3">
          <div data-ref="avatar" class="grid h-10 w-10 place-items-center rounded-xl text-sm font-bold text-white"></div>
          <div>
            <h2 data-ref="name" class="font-semibold"></h2>
            <p class="flex items-center gap-1.5 text-xs text-slate-400">
              <span data-ref="dot" class="h-2 w-2 rounded-full bg-slate-500"></span>
              <span data-ref="status">Offline</span>
            </p>
          </div>
        </div>
        <button data-ref="connect" class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-medium hover:bg-slate-800">Connect</button>
      </header>

      <div class="space-y-4 p-4">
        <div>
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Notification preferences</h3>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex cursor-pointer items-center justify-between rounded-lg bg-slate-800/60 px-3 py-2">
              <span class="text-sm">Game events</span>
              <span class="relative">
                <input type="checkbox" data-pref="game" class="peer sr-only" checked>
                <span class="block h-5 w-9 rounded-full bg-slate-600 transition peer-checked:bg-emerald-500"></span>
                <span class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition peer-checked:translate-x-4"></span>
              </span>
            </label>
            <label class="flex cursor-pointer items-center justify-between rounded-lg bg-slate-800/60 px-3 py-2">
              <span class="text-sm">Social events</span>
              <span class="relative">
                <input type="checkbox" data-pref="social" class="peer sr-only" checked>
                <span class="block h-5 w-9 rounded-full bg-slate-600 transition peer-checked:bg-emerald-500"></span>
                <span class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition peer-checked:translate-x-4"></span>
              </span>
            </label>
          </div>
        </div>

        <div>
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Game engine</h3>
          <div class="grid grid-cols-2 gap-2">
            <button data-action="level_up" class="action-btn"></button>
            <button data-action="acquire_item" class="action-btn">Find an item</button>
            <button data-action="complete_challenge" class="action-btn">Complete a challenge</button>
            <button data-action="attack" class="action-btn"></button>
            <button data-action="defeat" class="action-btn col-span-2"></button>
          </div>
        </div>

        <div>
          <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Social system</h3>
          <div class="grid grid-cols-2 gap-2">
            <button data-action="send_friend_request" class="action-btn"></button>
            <button data-action="follow" class="action-btn"></button>
          </div>
        </div>

        <p data-ref="last" class="min-h-[1rem] text-xs text-slate-400"></p>
      </div>

      <div class="flex flex-1 flex-col border-t border-slate-800">
        <div class="flex items-center justify-between px-4 pt-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
            Notifications <span data-ref="count" class="ml-1 rounded-full bg-slate-800 px-2 py-0.5 text-slate-300">0</span>
          </h3>
          <button data-ref="clear" class="text-xs text-slate-400 hover:text-slate-200">Clear</button>
        </div>
        <p data-ref="empty" class="px-4 py-8 text-center text-sm text-slate-500">No notifications yet.</p>
        <ol data-ref="feed" class="max-h-96 space-y-2 overflow-y-auto p-4"></ol>
      </div>
    </section>
  </template>

  <!-- One notification in the feed. -->
  <template id="notification-template">
    <li class="slide-in rounded-xl border border-slate-700/60 bg-slate-800/60 p-3">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p data-ref="title" class="text-sm font-semibold"></p>
          <p data-ref="message" class="text-sm text-slate-300"></p>
        </div>
        <span data-ref="badge" class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide"></span>
      </div>
      <div class="mt-2 flex items-center justify-between">
        <time data-ref="time" class="text-[11px] text-slate-500"></time>
        <button data-ref="accept" class="hidden rounded-md bg-emerald-600 px-2.5 py-1 text-xs font-medium hover:bg-emerald-500 disabled:cursor-default disabled:bg-slate-700">Accept</button>
      </div>
    </li>
  </template>

  <style type="text/tailwindcss">
    .action-btn {
      @apply rounded-lg bg-slate-800 px-3 py-2 text-left text-sm font-medium transition
             hover:bg-slate-700 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-40;
    }
  </style>

  <script>
    const ITEMS = [
      { name: "SwordOfAzeroth", rarity: "legendary" },
      { name: "DragonScaleArmor", rarity: "epic" },
      { name: "ElvenLongbow", rarity: "rare" },
      { name: "RustyDagger", rarity: "common" },
    ];
    const CHALLENGES = ["Dragon Slayer", "Speed Runner", "Flawless Victory", "Treasure Hunter"];
    const BADGE = {
      game: "bg-amber-500/15 text-amber-300",
      social: "bg-sky-500/15 text-sky-300",
    };
    const pick = (list) => list[Math.floor(Math.random() * list.length)];

    function refs(root) {
      return Object.fromEntries([...root.querySelectorAll("[data-ref]")].map((n) => [n.dataset.ref, n]));
    }

    class PlayerPanel {
      constructor(playerId, opponentId, accentClass) {
        this.id = playerId;
        this.opponent = opponentId;
        this.level = 1;
        this.count = 0;
        this.socket = null;
        this.pending = [];  // descriptions of sent actions, matched to server replies in order

        this.root = document.getElementById("panel-template").content.firstElementChild.cloneNode(true);
        this.ref = refs(this.root);
        this.ref.avatar.textContent = `P${playerId}`;
        this.ref.avatar.classList.add(accentClass);
        this.ref.name.textContent = `Player ${playerId}`;
        this.root.querySelector('[data-action="attack"]').textContent = `Attack Player ${opponentId}`;
        this.root.querySelector('[data-action="defeat"]').textContent = `Defeat Player ${opponentId}`;
        this.root.querySelector('[data-action="send_friend_request"]').textContent = `Friend request to P${opponentId}`;
        this.root.querySelector('[data-action="follow"]').textContent = `Follow Player ${opponentId}`;
        this.renderLevel();

        this.ref.connect.addEventListener("click", () => (this.socket ? this.socket.close() : this.connect()));
        this.ref.clear.addEventListener("click", () => this.clearFeed());
        this.root.querySelectorAll("[data-action]").forEach((btn) =>
          btn.addEventListener("click", () => this.trigger(btn.dataset.action)));
        this.root.querySelectorAll("[data-pref]").forEach((input) =>
          input.addEventListener("change", () => this.send(
            { action: "set_preference", category: input.dataset.pref, enabled: input.checked },
            `${input.checked ? "Enabled" : "Disabled"} ${input.dataset.pref} notifications`)));

        this.setConnected(false);
      }

      connect() {
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${scheme}://${location.host}/ws/${this.id}`);
        this.socket = socket;
        this.ref.status.textContent = "Connecting…";
        socket.addEventListener("open", () => this.setConnected(true));
        socket.addEventListener("message", (e) => this.onMessage(JSON.parse(e.data)));
        socket.addEventListener("close", () => {
          if (this.socket === socket) this.socket = null;
          this.pending = [];
          this.setConnected(false);
        });
      }

      setConnected(online) {
        this.ref.dot.className = `h-2 w-2 rounded-full ${online ? "bg-emerald-400" : "bg-slate-500"}`;
        this.ref.status.textContent = online ? "Online" : "Offline (notifications are dropped)";
        this.ref.connect.textContent = online ? "Disconnect" : "Connect";
        this.root.querySelectorAll("[data-action], [data-pref], [data-ref=accept]").forEach((el) => {
          if (!el.dataset.done) el.disabled = !online;
        });
      }

      trigger(action) {
        switch (action) {
          case "level_up":
            this.level += 1;
            this.renderLevel();
            return this.send({ action, level: this.level }, `Leveled up to ${this.level}`);
          case "acquire_item": {
            const item = pick(ITEMS);
            const note = item.rarity === "common" ? " (common: no notification expected)" : "";
            return this.send({ action, item_name: item.name, rarity: item.rarity },
              `Found ${item.rarity} ${item.name}${note}`);
          }
          case "complete_challenge": {
            const name = pick(CHALLENGES);
            return this.send({ action, challenge_name: name }, `Completed "${name}"`);
          }
          case "attack":
            return this.send({ action, target_id: this.opponent }, `Attacked Player ${this.opponent}`);
          case "defeat":
            return this.send({ action, target_id: this.opponent }, `Defeated Player ${this.opponent}`);
          case "send_friend_request":
            return this.send({ action, target_id: this.opponent }, `Sent a friend request to Player ${this.opponent}`);
          case "follow":
            return this.send({ action, target_id: this.opponent }, `Followed Player ${this.opponent}`);
        }
      }

      send(payload, description) {
        if (!this.socket || this.socket.readyState !== WebSocket.OPEN) return;
        this.pending.push(description);
        this.socket.send(JSON.stringify(payload));
      }

      onMessage(msg) {
        switch (msg.type) {
          case "notification":
            return this.addNotification(msg.data);
          case "preferences":
            for (const [category, enabled] of Object.entries(msg.data.enabled)) {
              const input = this.root.querySelector(`[data-pref="${category}"]`);
              if (input) input.checked = enabled;
            }
            return this.setLast(this.pending.shift());
          case "ack":
            return this.setLast(this.pending.shift());
          case "error":
            this.pending.shift();
            return this.setLast(`Error: ${msg.message}`, true);
        }
      }

      setLast(text, isError = false) {
        if (!text) return;
        this.ref.last.textContent = isError ? text : `✓ ${text}`;
        this.ref.last.className = `min-h-[1rem] text-xs ${isError ? "text-rose-400" : "text-slate-400"}`;
      }

      renderLevel() {
        this.root.querySelector('[data-action="level_up"]').textContent = `Level up (→ ${this.level + 1})`;
      }

      addNotification(n) {
        const item = document.getElementById("notification-template").content.firstElementChild.cloneNode(true);
        const r = refs(item);
        r.title.textContent = n.title;
        r.message.textContent = n.message;
        r.badge.textContent = n.category;
        r.badge.className += ` ${BADGE[n.category] ?? ""}`;
        r.time.textContent = new Date(n.created_at).toLocaleTimeString();

        if (n.event_type === "friend_request_sent" && n.actor_id != null) {
          r.accept.classList.remove("hidden");
          r.accept.addEventListener("click", () => {
            this.send({ action: "accept_friend_request", target_id: n.actor_id },
              `Accepted Player ${n.actor_id}'s friend request`);
            r.accept.textContent = "Accepted";
            r.accept.disabled = true;
            r.accept.dataset.done = "1";
          });
        }

        this.ref.feed.prepend(item);
        this.count += 1;
        this.renderCount();
      }

      clearFeed() {
        this.ref.feed.replaceChildren();
        this.count = 0;
        this.renderCount();
      }

      renderCount() {
        this.ref.count.textContent = this.count;
        this.ref.empty.classList.toggle("hidden", this.count > 0);
      }
    }

    const panels = document.getElementById("panels");
    for (const [id, opponent, accent] of [[1, 2, "bg-violet-600"], [2, 1, "bg-cyan-600"]]) {
      const panel = new PlayerPanel(id, opponent, accent);
      panels.append(panel.root);
      panel.connect();
    }
  </script>
</body>
</html>
